apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac.yaml
  - cronjobs/
configMapGenerator:
  - name: seed-bao-sh
    namespace: vault
    files:
      - scripts/seed-bao.sh
  - name: init-bao-sh
    namespace: vault
    files:
      - scripts/init-bao.sh
generatorOptions:
  disableNameSuffixHash: true
