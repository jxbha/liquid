apiVersion: batch/v1
kind: Job
metadata:
  name: init-bao
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: bao-init
      restartPolicy: OnFailure
      volumes:
        - name: init-bao-sh
          configMap:
            name: init-bao-sh
            defaultMode: 0755
      containers:
        - name: init-bao-sh
          image: openbao/openbao:2.4.4
          env:
            - name: BAO_ADDR
              value: "http://openbao:8200"
          volumeMounts:
            - name: init-bao-sh
              mountPath: /scripts/
          command: ["/scripts/init-bao.sh"]
