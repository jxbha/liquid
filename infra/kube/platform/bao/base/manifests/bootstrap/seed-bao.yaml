apiVersion: batch/v1
kind: Job
metadata:
  name: seed-bao
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: bao-seed
      restartPolicy: OnFailure
      volumes:
        - name: seed-bao-sh
          configMap:
            name: seed-bao-sh
        - name: tailscale
          configMap:
            name: tailscale
        - name: brevo
          configMap:
            name: brevo
        - name: sops-key
          secret:
            secretName: sops-key
      containers:
        - name: seed-bao
          image: openbao/openbao:2.4.4
          env:
            - name: BAO_ADDR
              value: "http://openbao:8200"
            - name: SOPS_AGE_KEY_FILE
              value: /opt/sops-key.txt
          volumeMounts:
            - name: seed-bao-sh
              mountPath: /opt/seed-bao.sh
            - name: tailscale
              mountPath: /opt/tailscale.yaml
              subPath: tailscale.enc.yaml
            - name: brevo
              mountPath: /opt/brevo.yaml
              subPath: brevo.enc.yaml
            - name: sops-key
              mountPath: /opt/sops-key.txt
              subPath: keys.txt
          command: ["/scripts/seed-bao.sh"]
