apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: vault

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-binding
  namespace: vault
subjects:
  - kind: ServiceAccount
    name: vault-auth
    namespace: vault
roleRef:
  kind: ClusterRole
  name: system:auth-delegator
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bao-init
  namespace: vault

---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: bao-init
  namespace: vault
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "get", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bao-init
  namespace: vault
subjects:
  - kind: ServiceAccount
    name: bao-init
    namespace: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bao-init

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ca-pull
  namespace: vault

---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: ca-pull
  namespace: vault
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ca-pull
  namespace: vault
subjects:
  - kind: ServiceAccount
    name: ca-pull
    namespace: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ca-pull

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bao-seed
  namespace: vault

---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: bao-seed
  namespace: vault
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["sops-key"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bao-seed
  namespace: vault
subjects:
  - kind: ServiceAccount
    name: bao-seed
    namespace: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bao-seed

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bootstrap-bao
  namespace: vault

---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: bootstrap-bao
  namespace: vault
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list", "create", "update", "get"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["list", "create", "update", "get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bootstrap-bao
  namespace: vault
subjects:
  - kind: ServiceAccount
    name: bootstrap-bao
    namespace: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bootstrap-bao
