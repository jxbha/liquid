apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - local-path-storage-v0.0.35.yaml
patches:
  - patch: |-
      - op: add
        path: /metadata/annotations/storageclass.kubernetes.io/is-default-class
        value: "true"
    target:
      kind: StorageClass
      name: local-path
