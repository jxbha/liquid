apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: liquid-monitoring
  namespace: argocd
  labels:
    name: liquid-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: http://gitea.jbernh.xyz:3000/root/liquid.git
    path: infra/kube/platform/monitoring/overlays/prod
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      enabled: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
